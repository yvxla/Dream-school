<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4b0cd"><title>MY DREAM SCHOOL ♡</title>
<style>
:root{--p:#f4b0cd;--pale:#fff0f6;--ink:#302938;--muted:#887b8b;--line:#eedee7;--lav:#eee8ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff7fb,#f7f3ff 60%,#f2fff8);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}.app{max-width:760px;margin:auto;padding:14px 13px 90px}.hero{border-radius:25px;padding:22px;background:linear-gradient(130deg,#ffe0eb,#f7b8d2,#e9e0ff);box-shadow:0 8px 24px #4b243014;border:1px solid white}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800}.hero h1{font-size:35px;line-height:1.02;margin:9px 0}.hero p{font-size:12px;margin:0;color:#665365}.pill{display:inline-block;background:#ffffffbd;border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.hero button{border:1px solid white;background:#ffffffa8;padding:8px 11px;border-radius:12px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat,.panel{background:#ffffffde;border:1px solid white;border-radius:17px;box-shadow:0 7px 22px #4b243010}.stat{padding:11px}.stat small{display:block;font-size:10px;color:var(--muted)}.stat strong{display:block;margin-top:4px;font-size:16px}.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.tabs button,.bottom button{border:1px solid var(--line);border-radius:12px;background:#ffffffbd;padding:10px 11px;font-size:12px;white-space:nowrap;font-weight:800;color:#695c6b}.tabs button.active,.bottom button.active{background:var(--ink);color:white;border-color:var(--ink)}.panel{padding:16px;margin-bottom:12px}.panel h2{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin:0 0 14px}.tag{background:var(--pale);color:#955574;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:800}.notice{background:#fff8e9;border:1px solid #f0e0b9;border-radius:12px;padding:10px;font-size:11px;line-height:1.6;margin-bottom:12px}.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:11px;font-weight:800;color:#6e5e70}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);font:inherit;font-size:13px}.field textarea{min-height:76px}.btn{border:0;border-radius:12px;background:var(--ink);color:white;padding:10px 13px;font-size:12px;font-weight:800}.btn.soft{background:var(--pale);color:#92516e;border:1px solid #f3d5e2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;text-align:left;color:var(--ink);min-height:74px}.choice strong{display:block;font-size:12px}.choice span{display:block;font-size:11px;color:var(--muted);margin-top:5px}.item{border:1px solid var(--line);background:white;border-radius:13px;padding:11px;margin:8px 0}.item strong{font-size:13px}.item p{font-size:12px;color:var(--muted);white-space:pre-wrap;margin:5px 0;overflow-wrap:anywhere}.itemtop{display:flex;justify-content:space-between;gap:8px;align-items:start}.timeline{display:grid;gap:8px}.timeitem{display:grid;grid-template-columns:55px 1fr;gap:9px;background:#fff8fb;border:1px solid #f6e5ec;border-radius:12px;padding:10px}.timeitem time{font-size:12px;font-weight:900;color:#a65e7d}.timeitem strong{font-size:12px}.timeitem p{font-size:11px;color:var(--muted);margin:4px 0}.check{display:flex;align-items:center;gap:8px;font-size:12px;padding:8px 0;border-bottom:1px dashed var(--line)}input[type=checkbox]{accent-color:#e78db2;width:17px;height:17px}.meter{height:8px;background:#f2e8ef;border-radius:99px;overflow:hidden;margin:8px 0}.meter span{display:block;height:100%;background:linear-gradient(90deg,#f5a9c8,#c6b6ff)}.small{font-size:11px;color:var(--muted)}.empty{text-align:center;border:1px dashed #e6cbd8;border-radius:13px;padding:17px;color:var(--muted);font-size:12px}.room{background:linear-gradient(130deg,#fbe5ed,#f1eaff);padding:14px;border-radius:14px}.hide{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:#ffffffed;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.bottom button{flex:1;max-width:120px;font-size:10px;padding:7px 3px;border-color:transparent}.bottom span{display:block;font-size:17px;margin-bottom:2px}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 14px;border-radius:99px;font-size:12px;z-index:20}.footer{text-align:center;color:#9c8c9a;font-size:10px;padding:16px}@media(min-width:600px){.app{padding-top:24px}.hero{padding:27px}.hero h1{font-size:40px}}
</style></head><body><div class="app">
<header class="hero"><div class="row"><span class="eyebrow">MY LITTLE SCHOOL DIARY</span><span class="pill">나의 꿈 · my dream</span></div><h1>MY DREAM<br>SCHOOL ♡</h1><p>내가 꿈꾸는 학교생활 · 私が夢見る高校生活</p><div class="row" style="margin-top:15px"><span id="daylabel" class="pill">DAY 01 · 꿈을 시작해요</span><div><button id="next">次の日へ →</button> <button id="dayone">DAY 1</button></div></div></header>
<div class="stats"><div class="stat"><small>오늘의 기분 · 気分</small><strong id="moodstat">♡ ときめき</strong></div><div class="stat"><small>학교생활 · 学校生活</small><strong id="daystat">DAY 01</strong></div><div class="stat"><small>저금 · 貯金</small><strong id="cashstat">¥0</strong></div></div>
<nav class="tabs"><button class="active" data-page="day">🏫 1日の生活</button><button data-page="story">💌 友達・イベント</button><button data-page="room">🛋️ お部屋</button><button data-page="diary">📸 日記</button><button data-page="study">📚 勉強</button><button data-page="money">💰 貯金</button><button data-page="profile">🎀 学校設定</button></nav><main id="main"></main><div class="footer">made with dreams & tiny stars · 꿈은 천천히 이루어져요 ♡<br>記録はこのブラウザ内に保存されます</div></div>
<nav class="bottom"><button class="active" data-page="day"><span>🏫</span>生活</button><button data-page="story"><span>💌</span>イベント</button><button data-page="diary"><span>📔</span>日記</button><button data-page="study"><span>📚</span>勉強</button><button data-page="profile"><span>🎀</span>設定</button></nav><div id="toast" class="toast hide"></div>
<script>
const KEY='myDreamSchool_v1';
const defaults={day:1,mood:'♡ ときめき',school:{name:'별빛고등학교',nameJa:'星明高校（自分の設定）',location:'韓国・未設定',uniform:'ブレザー＋リボン',start:'08:30',finish:'16:00',notes:'理想の学校プロフィール。実在校の情報ではありません。'},schedule:[['07:00','기상 · 朝の支度','好きな音楽を流してゆっくり準備'],['08:00','등교 · 登校','制服を着て今日の気分を整える'],['08:30','조회 · 朝のホームルーム','友達に挨拶して一日スタート'],['09:00','수업 · 授業','韓国語や好きな教科をがんばる'],['12:30','점심시간 · 昼休み','友達と一緒にランチ'],['15:30','방과 후 · 放課後','部活・自習・友達との時間'],['18:00','나만의 시간 · 自分時間','勉強や日記、好きなこと']],completed:[],story:[],diary:[],words:[],study:[],savings:[],room:{style:'ピンク×クリーム',items:['🛏️','🪞','💡'],rent:65000,goal:300000},prep:[],prepNote:''};
function merge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;if(a&&typeof a==='object'){let o={...a};for(let k in b||{})o[k]=k in a?merge(a[k],b[k]):b[k];return o}return b===undefined?a:b}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?merge(defaults,x):structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
let s=load(),page='day';
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));stats()}catch(e){say('保存容量がいっぱいかも。写真や記録を整理してね')}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function yen(v){return '¥'+Number(v||0).toLocaleString('ja-JP')}
function say(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hide');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.add('hide'),2200)}
function stats(){document.getElementById('daylabel').textContent='DAY '+String(s.day).padStart(2,'0')+' · 꿈을 시작해요';document.getElementById('daystat').textContent='DAY '+String(s.day).padStart(2,'0');document.getElementById('moodstat').textContent=s.mood;document.getElementById('cashstat').textContent=yen(s.savings.reduce((a,x)=>a+Number(x.amount),0))}
function box(title,sub,body,tag=''){return `<section class="panel"><div class="row"><h2>${title}</h2>${tag?`<span class="tag">${tag}</span>`:''}</div><p class="sub">${sub}</p>${body}</section>`}
function render(p=page){page=p;stats();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('main').innerHTML=({day,story,room,diary,study,money,profile}[p]||day)();wire()}
function day(){return box('오늘의 학교생활','今日の高校生活 · 予定をチェックしよう','<div class="notice">これは理想の高校生活シミュレーションです。実際の韓国の学校の時間割・制度は学校ごとに異なります。</div><div class="field"><label>오늘의 기분 · 今日の気分</label><select id="mood">'+['♡ ときめき','☁️ ちょっと眠い','✧ やる気満々','🌷 のんびり','☆ ドキドキ'].map(x=>`<option ${s.mood===x?'selected':''}>${x}</option>`).join('')+'</select></div><div class="timeline">'+s.schedule.map((x,i)=>`<div class="timeitem"><time>${esc(x[0])}</time><div><strong>${esc(x[1])}</strong><p>${esc(x[2])}</p><label class="check"><input type="checkbox" data-task="${i}" ${s.completed.includes(s.day+'-'+i)?'checked':''}> この予定を完了 · 완료</label></div></div>`).join('')+'</div><hr><h3 style="font-size:14px">방과 후 · 放課後、何をする？</h3><div class="grid">'+[['club','🎨 部活に行く','好きなことに挑戦'],['study','📚 図書館で自習','目標をひとつ達成'],['friends','🍰 友達と寄り道','思い出イベント'],['home','🛋️ まっすぐ帰宅','自分の時間']].map(x=>`<button class="choice" data-after="${x[0]}"><strong>${x[1]}</strong><span>${x[2]}</span></button>`).join('')+'</div><p class="small">完了した予定：'+s.completed.filter(x=>x.startsWith(s.day+'-')).length+' / '+s.schedule.length+'</p>','DAY '+s.day)}
function story(){let ev=[['初めての席替え','隣の席の子が笑顔で話しかけてくれた',['自分から自己紹介','好きな音楽を聞く','少しずつ仲良くなる']],['お昼休みのお誘い','クラスメイトが一緒にランチしようと誘ってくれた',['一緒に食べる！','好きな食べ物の話','次は自分から誘う']],['学校祭の準備','クラスで学校祭の出し物を相談中',['飾りつけ担当','企画を考える','意見をまとめる']],['放課後の雨','友達が傘を持っていないみたい',['一緒に帰ろうと声をかける','近くで雨宿り','温かい飲み物を買う']],['小さなテスト','勉強したところがテストに出た！',['自分をほめる','友達と答え合わせ','次の目標を決める']]];return box('우리의 이야기 · 友達とイベント','選んだ行動が思い出ログに残るよ','<div class="notice">イベントと登場人物は創作です。実在校の出来事ではありません。</div>'+ev.map((e,i)=>`<div class="item"><strong>${e[0]}</strong><p>${e[1]}</p><div class="grid">${e[2].map(c=>`<button class="choice" data-story="${i}" data-choice="${c}"><strong>${c}</strong><span>선택하기 · 選ぶ</span></button>`).join('')}</div></div>`).join('')+'<hr><h3 style="font-size:14px">추억 모음 · 思い出ログ</h3>'+(s.story.slice().reverse().map(x=>`<div class="item"><div class="itemtop"><strong>${esc(x.title)}</strong><span class="pill">DAY ${x.day}</span></div><p>${esc(x.choice)}<br>${esc(x.result)}</p></div>`).join('')||'<div class="empty">まだ思い出がないよ。イベントを選んでね ♡</div>'),'STORY')}
function room(){let items=[['🛏️','ベッド'],['🪞','姿見'],['💡','間接照明'],['📚','本棚'],['🪴','観葉植物'],['🧸','ぬいぐるみ'],['🪑','勉強机'],['🎧','ヘッドホン'],['🪟','カーテン'],['🧺','ランドリーかご']];return box('나의 방 · 理想のお部屋','一人暮らしの夢を、予算と一緒に考えよう','<div class="room"><div class="eyebrow">MY LITTLE ROOM</div><div style="font-size:26px;margin:8px 0">'+s.room.items.join(' ')+'</div><strong>'+esc(s.room.style)+'</strong><p class="small">나만의 공간 · 私だけの空間</p></div><div class="field"><label>お部屋のテーマ</label><input id="roomstyle" value="'+esc(s.room.style)+'"></div><div class="field"><label>置きたい家具</label><div class="grid">'+items.map(x=>`<label class="check"><input type="checkbox" data-furn="${x[0]}" ${s.room.items.includes(x[0])?'checked':''}>${x.join(' ')}</label>`).join('')+'</div></div><div class="grid"><div class="field"><label>想定家賃（月・円）</label><input id="rent" type="number" min="0" value="'+s.room.rent+'"></div><div class="field"><label>貯金の目標（円）</label><input id="goal" type="number" min="0" value="'+s.room.goal+'"></div></div><button class="btn" id="saveRoom">お部屋を保存 ♡</button><p class="small">家賃や生活費は地域・物件によって変わります。ここは計画用の目安です。</p>','ROOM')}
function diary(){return box('오늘의 일기 · 日記とアルバム','写真やことばで、理想の高校生活を記録しよう','<form id="df"><div class="field"><label>タイトル · 제목</label><input name="title" placeholder="初めて友達とカフェに行った日"></div><div class="field"><label>今日の思い出 · 오늘의 추억</label><textarea name="body" required placeholder="今日はどんな一日だった？"></textarea></div><div class="field"><label>写真を添える（任意）</label><input name="photo" type="file" accept="image/*"><span class="small">写真は縮小して保存。容量上限に注意してね。</span></div><button class="btn">日記を保存する ♡</button></form><hr>'+(s.diary.slice().reverse().map((d,r)=>`<div class="item"><div class="itemtop"><strong>${esc(d.title||'오늘의 일기')}</strong><span class="pill">DAY ${d.day}</span></div><p>${esc(d.body)}</p>${d.photo?`<img src="${d.photo}" alt="日記の写真" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px">`:''}<button class="btn soft" data-del="diary" data-i="${s.diary.length-1-r}">削除</button></div>`).join('')||'<div class="empty">最初の思い出を残してみよう 📸</div>'),'MEMORIES')}
function study(){return '<div class="grid" style="grid-template-columns:1fr">'+box('한국어 단어장 · 韓国語単語帳','覚えたい単語を自分で登録','<form id="wf"><div class="grid"><div class="field"><label>한국어</label><input name="kr" required placeholder="설렘"></div><div class="field"><label>日本語</label><input name="ja" required placeholder="ときめき"></div></div><div class="field"><label>メモ</label><input name="note" placeholder="例：ドキドキする気持ち"></div><button class="btn">単語を追加 +</button></form><hr>'+(s.words.map((w,i)=>`<div class="item"><div class="itemtop"><strong>${esc(w.kr)} / ${esc(w.ja)}</strong><button class="btn soft" data-del="words" data-i="${i}">削除</button></div><p>${esc(w.note)}</p></div>`).join('')||'<div class="empty">単語を登録してみよう</div>'))+box('공부 기록 · 勉強記録','勉強時間と小さな進歩を記録','<form id="sf"><div class="grid"><div class="field"><label>教科</label><input name="subject" required placeholder="韓国語"></div><div class="field"><label>勉強時間（分）</label><input name="minutes" type="number" min="1" required placeholder="25"></div></div><div class="field"><label>ひとこと</label><input name="note" placeholder="今日できたこと"></div><button class="btn">記録する +</button></form><hr><p class="small">合計勉強時間：'+s.study.reduce((a,x)=>a+Number(x.minutes),0)+'分</p>'+(s.study.slice().reverse().map((x,r)=>`<div class="item"><div class="itemtop"><strong>${esc(x.subject)} · ${x.minutes}分</strong><span class="pill">DAY ${x.day}</span></div><p>${esc(x.note)}</p><button class="btn soft" data-del="study" data-i="${s.study.length-1-r}">削除</button></div>`).join('')||'<div class="empty">今日の勉強を記録しよう</div>'))+'</div>'}
function money(){let total=s.savings.reduce((a,x)=>a+Number(x.amount),0),goal=Number(s.room.goal||0);return box('저금 노트 · 貯金ノート','夢に近づくためのお金を見える化しよう','<div class="item"><div class="itemtop"><strong>나의 목표 · 貯金目標</strong><strong>'+yen(total)+' / '+yen(goal)+'</strong></div><div class="meter"><span style="width:'+Math.min(100,goal?total/goal*100:0)+'%"></span></div><p>'+(goal?Math.min(100,Math.round(total/goal*100))+'% 達成':'目標金額をお部屋ページで設定してね')+'</p></div><form id="mf"><div class="field"><label>記録の種類</label><select name="kind"><option>貯金した</option><option>おこづかい</option><option>アルバイト収入（想定）</option><option>支出（マイナス）</option></select></div><div class="field"><label>メモ</label><input name="label" required placeholder="今月の貯金"></div><div class="field"><label>金額（円）</label><input name="amount" type="number" min="1" required placeholder="1000"></div><button class="btn">お金を記録する +</button></form><p class="small">これは計画用の記録です。アルバイトの年齢・労働時間などの条件は法律や職場の規則を確認し、保護者など信頼できる大人と相談してね。</p><hr>'+(s.savings.slice().reverse().map((x,r)=>`<div class="item"><div class="itemtop"><strong>${esc(x.label)}</strong><strong>${yen(x.amount)}</strong></div><p>DAY ${x.day} · ${esc(x.kind)}</p><button class="btn soft" data-del="savings" data-i="${s.savings.length-1-r}">削除</button></div>`).join('')||'<div class="empty">最初の貯金を記録してみよう</div>'),'SAVINGS')}
function profile(){let x=s.school;return box('학교 프로필 · 学校プロフィール','理想の学校をカスタマイズ','<div class="notice">このプロフィールは自由に作る理想設定です。実在する韓国の学校の入学条件・費用・制度を示すものではありません。進学準備では学校公式サイトや公的機関の最新情報を確認してね。</div><form id="pf"><div class="field"><label>학교 이름 · 学校名（自由設定）</label><input name="name" value="'+esc(x.name)+'" required></div><div class="field"><label>日本語の名前・読み方</label><input name="nameJa" value="'+esc(x.nameJa)+'"></div><div class="field"><label>場所（未確認なら未設定）</label><input name="location" value="'+esc(x.location)+'"></div><div class="field"><label>制服イメージ</label><input name="uniform" value="'+esc(x.uniform)+'"></div><div class="grid"><div class="field"><label>登校時間（理想）</label><input name="start" type="time" value="'+esc(x.start)+'"></div><div class="field"><label>下校時間（理想）</label><input name="finish" type="time" value="'+esc(x.finish)+'"></div></div><div class="field"><label>メモ・調べたいこと</label><textarea name="notes">'+esc(x.notes)+'</textarea></div><button class="btn">プロフィールを保存 ♡</button></form><hr><h3 style="font-size:14px">進学準備 체크리스트</h3>'+['気になる学校の公式サイトを探す','入学対象・出願条件を公式情報で確認','必要な韓国語力・語学要件を確認','学費・寮費・生活費を確認','出願時期と必要書類を確認','保護者・先生などと相談'].map((v,i)=>`<label class="check"><input type="checkbox" data-prep="${i}" ${s.prep.includes(i)?'checked':''}>${v}</label>`).join('')+'<div class="field"><label>公式サイトURL・確認メモ</label><textarea id="pn" placeholder="確認日、公式情報のURL、質問など">'+esc(s.prepNote)+'</textarea></div><button class="btn soft" id="saveprep">準備メモを保存</button><hr><button class="btn soft" id="export">バックアップを書き出す（JSON）</button> <button class="btn soft" id="importbtn">バックアップを読み込む</button><input type="file" id="importfile" class="hide" accept=".json,application/json"><p class="small">保存先：このブラウザのlocalStorage。端末変更やブラウザのデータ削除に備えてバックアップしてね。</p>','PROFILE')}
async function photoData(file){return new Promise(res=>{let im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,850/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>{URL.revokeObjectURL(url);res('')};im.src=url})}
function wire(){let m=document.getElementById('mood');if(m)m.onchange=()=>{s.mood=m.value;save()};document.querySelectorAll('[data-task]').forEach(e=>e.onchange=()=>{let k=s.day+'-'+e.dataset.task;if(e.checked&&!s.completed.includes(k))s.completed.push(k);else s.completed=s.completed.filter(x=>x!==k);save()});
document.querySelectorAll('[data-after]').forEach(e=>e.onclick=()=>{let vals={club:['部活に行く','新しいことに挑戦して少し自信がついた'],study:['図書館で自習','集中して勉強できた。今日の自分に拍手！'],friends:['友達と寄り道','友達と笑い合う放課後になった'],home:['まっすぐ帰宅','好きな音楽で自分時間を楽しんだ']},v=vals[e.dataset.after];s.story.push({title:'放課後の選択',choice:v[0],result:v[1],day:s.day});save();render('story');say(v[1])});
document.querySelectorAll('[data-story]').forEach(e=>e.onclick=()=>{let titles=['初めての席替え','お昼休みのお誘い','学校祭の準備','放課後の雨','小さなテスト'],results=['お互いの好きなものがわかって少し距離が縮まった','一緒に過ごす時間がやさしい思い出になった','それぞれの得意なことを活かして準備が進んだ','相手を思いやる気持ちがあたたかい思い出になった','努力したことに気づけて次もがんばろうと思えた'];s.story.push({title:titles[+e.dataset.story],choice:e.dataset.choice,result:results[+e.dataset.story],day:s.day});save();render('story');say('새로운 추억! 思い出が増えたよ ♡')});
document.querySelectorAll('[data-furn]').forEach(e=>e.onchange=()=>{let v=e.dataset.furn;if(e.checked&&!s.room.items.includes(v))s.room.items.push(v);else s.room.items=s.room.items.filter(x=>x!==v);save();render('room')});
let sr=document.getElementById('saveRoom');if(sr)sr.onclick=()=>{s.room.style=document.getElementById('roomstyle').value;s.room.rent=+document.getElementById('rent').value||0;s.room.goal=+document.getElementById('goal').value||0;save();render('room');say('お部屋を保存したよ ♡')};
let df=document.getElementById('df');if(df)df.onsubmit=async e=>{e.preventDefault();let f=new FormData(df),file=f.get('photo'),photo='';if(file&&file.size){if(file.size>8*1024*1024){say('写真は8MB以下のものを選んでね');return}photo=await photoData(file)}s.diary.push({title:f.get('title'),body:f.get('body'),photo,day:s.day});save();render('diary');say('日記を保存したよ ♡')};
let wf=document.getElementById('wf');if(wf)wf.onsubmit=e=>{e.preventDefault();let f=new FormData(wf);s.words.push({kr:f.get('kr'),ja:f.get('ja'),note:f.get('note')});save();render('study');say('単語を追加したよ')};
let sf=document.getElementById('sf');if(sf)sf.onsubmit=e=>{e.preventDefault();let f=new FormData(sf);s.study.push({subject:f.get('subject'),minutes:+f.get('minutes'),note:f.get('note'),day:s.day});save();render('study');say('勉強記録を保存したよ')};
let mf=document.getElementById('mf');if(mf)mf.onsubmit=e=>{e.preventDefault();let f=new FormData(mf),amount=+f.get('amount');if(f.get('kind')==='支出（マイナス）')amount=-amount;s.savings.push({label:f.get('label'),amount,kind:f.get('kind'),day:s.day});save();render('money');say('貯金ノートを更新したよ')};
let pf=document.getElementById('pf');if(pf)pf.onsubmit=e=>{e.preventDefault();let f=new FormData(pf);s.school=Object.fromEntries(['name','nameJa','location','uniform','start','finish','notes'].map(k=>[k,f.get(k)]));save();render('profile');say('학교 프로필 저장 완료!')};
document.querySelectorAll('[data-prep]').forEach(e=>e.onchange=()=>{let i=+e.dataset.prep;if(e.checked&&!s.prep.includes(i))s.prep.push(i);else s.prep=s.prep.filter(x=>x!==i);save()});
let sp=document.getElementById('saveprep');if(sp)sp.onclick=()=>{s.prepNote=document.getElementById('pn').value;save();say('準備メモを保存したよ')};
let ex=document.getElementById('export');if(ex)ex.onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.href=u;a.download='my-dream-school-backup.json';a.click();URL.revokeObjectURL(u)};
let ib=document.getElementById('importbtn'),iff=document.getElementById('importfile');if(ib)ib.onclick=()=>iff.click();if(iff)iff.onchange=async()=>{try{let v=JSON.parse(await iff.files[0].text());if(!v||!v.school)throw Error();s=merge(defaults,v);save();render('profile');say('バックアップを読み込んだよ')}catch(e){say('バックアップを読み込めませんでした')}};
document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{if(!confirm('この記録を削除する？'))return;s[e.dataset.del].splice(+e.dataset.i,1);save();render(page);say('削除したよ')})}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));document.getElementById('next').onclick=()=>{s.day++;s.mood='♡ ときめき';save();render('day');say('새로운 하루 · 新しい一日が始まったよ ♡')};document.getElementById('dayone').onclick=()=>{s.day=1;save();render('day')};render('day');
</script></body></html>
